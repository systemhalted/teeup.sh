# Catppuccin Mocha, as a teeup semantic palette. The keys are roles, not
# colour names, so a template never has to know which theme is loaded.
# Values match Omarchy's themes/catppuccin/colors.toml on purpose: the same
# palette renders the Arch desktop and this Mac.
mode = "dark"

# Not a colour: bat has no Catppuccin theme built in, so the palette names the
# closest built-in. Rendered into env.sh as BAT_THEME.
bat_theme = "OneHalfDark"

# Not colours either: the name each editor knows the closest theme by. Every
# key here must exist in both modes, and a user theme must define them too.
emacs_theme = "modus-vivendi"
zed_theme = "Catppuccin Mocha"
zed_extension = "catppuccin"
neovim_colorscheme = "catppuccin-mocha"
vscode_theme = "Catppuccin Mocha"
vscode_extension = "Catppuccin.catppuccin-vsc"

accent = "#89b4fa"
selection = "#45475a"
muted = "#585b70"

background = "#1e1e2e"
dark_background = "#161622"
darker_background = "#101019"
lighter_background = "#313244"

foreground = "#cdd6f4"
dark_foreground = "#6c7086"
light_foreground = "#bac2de"
bright_foreground = "#cdd6f4"

red = "#f38ba8"
yellow = "#f9e2af"
orange = "#f6b6ab"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
magenta = "#f5c2e7"
brown = "#7b5b55"

bright_red = "#f38ba8"
bright_yellow = "#f9e2af"
bright_green = "#a6e3a1"
bright_cyan = "#94e2d5"
bright_blue = "#89b4fa"
bright_magenta = "#f5c2e7"
