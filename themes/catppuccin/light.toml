# Catppuccin Latte. Same keys as dark.toml, so every template renders in both
# modes without a single conditional.
mode = "light"

bat_theme = "OneHalfLight"

# Not colours either: the name each editor knows the closest theme by. Every
# key here must exist in both modes, and a user theme must define them too.
emacs_theme = "modus-operandi"
zed_theme = "Catppuccin Latte"
zed_extension = "catppuccin"
neovim_colorscheme = "catppuccin-latte"

accent = "#1e66f5"
selection = "#ccd0da"
muted = "#acb0be"

background = "#eff1f5"
dark_background = "#e3e4e8"
darker_background = "#d7d8dc"
lighter_background = "#dce0e8"

foreground = "#4c4f69"
dark_foreground = "#9ca0b0"
light_foreground = "#5c5f77"
bright_foreground = "#4c4f69"

red = "#d20f39"
yellow = "#df8e1d"
orange = "#d84e2b"
green = "#40a02b"
cyan = "#179299"
blue = "#1e66f5"
magenta = "#ea76cb"
brown = "#6c2715"

bright_red = "#d20f39"
bright_yellow = "#df8e1d"
bright_green = "#40a02b"
bright_cyan = "#179299"
bright_blue = "#1e66f5"
bright_magenta = "#ea76cb"
