# ~/.config/aerospace/local.toml - machine-specific AeroSpace settings.
# teeup ships this once, with every entry commented out, and never touches it
# again; it is yours to edit. `teeup configure aerospace` (also run by
# `teeup update`) folds it onto teeup's shipped aerospace.toml to produce
# ~/.config/aerospace/aerospace.toml -- AeroSpace itself has no include
# mechanism, so this is the only way a setting here can reach that file.
#
# Three rules for what you put below:
#   - a [table] here replaces teeup's table of the same name entirely (a
#     [gaps] block below gives you your gaps, not a mix of the two);
#   - a bare top-level `key = value` replaces just that key;
#   - anything here that teeup's aerospace.toml does not mention is added.
#
# ~/.config/aerospace/aerospace.toml itself is regenerated from teeup's base
# plus this file on every `teeup configure aerospace`, but only while it is
# still exactly what teeup last wrote there -- edit it by hand and teeup
# leaves it alone from then on (put machine tweaks here instead, or run
# `teeup reset aerospace` to take the new generated version).

# Example: override a single root-level setting.
# start-at-login = false

# Example: replace a whole table. Any subset of [gaps] you list here replaces
# every key teeup's [gaps] sets, not just the ones you name.
# [gaps]
# inner.horizontal = 12
# inner.vertical = 12
# outer.left = 12
# outer.bottom = 12
# outer.top = 12
# outer.right = 12

# Example: which monitor each workspace belongs to. This is a fact about one
# desk, not a teeup default, which is why teeup's own aerospace.toml never
# sets it -- shipping it there would force this exact monitor layout onto
# every machine, including a single-monitor one where it would be dead
# weight. The mapping below is a real three-monitor layout: workspaces 1-3
# on the main display, 4-6 on the second, 7-9 on the third.
# [workspace-to-monitor-force-assignment]
# 1 = 'main'
# 2 = 'main'
# 3 = 'main'
# 4 = '2'
# 5 = '2'
# 6 = '2'
# 7 = '3'
# 8 = '3'
# 9 = '3'
