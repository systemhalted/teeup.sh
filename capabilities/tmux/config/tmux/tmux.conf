# $XDG_CONFIG_HOME/tmux/tmux.conf (~/.config/tmux/tmux.conf by default) -
# installed once by teeup; this copy is yours.
# tmux 3.1 and newer read this path. tmux also reads ~/.tmux.conf, before this
# file, when one exists; teeup does not install this copy next to one.

# C-a as the prefix, ported from the previous dotfiles.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# WezTerm reports TERM=xterm-256color and draws 24-bit colour.
set -as terminal-features ",xterm-256color:RGB"

# Splits that keep the current directory, and a reload key.
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
# run-shell, not a literal path: tmux installs this file under
# $XDG_CONFIG_HOME when one is set, and `source-file ~/.config/...` would then
# reload a file that is not this one (or fail). run-shell expands the variable
# in the user's own environment, at the moment the key is pressed.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "tmux.conf reloaded"'
